name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Set up Java
      uses: actions/setup-java@v5
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Set up Android SDK
      run: |
        export ANDROID_SDK_ROOT=$ANDROID_HOME
        yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses > /dev/null 2>&1 || true

    - name: Install dependencies
      run: npm install

    - name: Add Android platform
      run: npx cordova platform add android

    - name: Build Release APK
      run: npx cordova build android --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: PBS-Agents-APK
        path: platforms/android/app/build/outputs/apk/release/app-release.apk
